[project]
name = "listed-options-backend"
version = "0.1.0"
requires-python = ">=3.15"
dependencies = [
    "dash>=4.5.0",
    "dash-ag-grid>=35.3.0",
    "numpy>=2.4.6",
    "pandas>=3.1.0",
    "prettytable>=3.18.0",
    "python-dateutil>=4.0.0",
    "scipy>=1.17.1",
    "tzdata>=2026.6",
    "yfinance>=1.8.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "-p no:dash"  # dash ships a pytest plugin for browser tests we don't use; it warns on pytest 9

[tool.ruff]
line-length = 120

[tool.ruff.lint]
ignore = ["C408"]  # dict(l=..., r=...) is the usual way to write plotly layouts
