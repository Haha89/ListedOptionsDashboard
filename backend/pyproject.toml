[project]
name = "listed-options-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi<0.100",
    "fastapi-utils==0.2.1",
    "numpy>=2.4.6",
    "pandas>=3.1.0",
    "prettytable>=3.18.0",
    "psycopg2-binary>=2.9.13",
    "pydantic<2",
    "python-dateutil>=4.0.0",
    "pytz>=2026.6",
    "scipy>=1.17.1",
    "sqlalchemy<2",
    "uvicorn>=0.54.0",
    "yfinance>=1.8.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
