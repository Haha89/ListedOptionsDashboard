[project]
name = "listed-options-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "dash>=4.5.0",
    "numpy>=2.4.6",
    "pandas>=3.1.0",
    "prettytable>=3.18.0",
    "python-dateutil>=4.0.0",
    "pytz>=2026.6",
    "scipy>=1.17.1",
    "yfinance>=1.8.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
ignore = ["C408"]  # dict(l=..., r=...) is the usual way to write plotly layouts
